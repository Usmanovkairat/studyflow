<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}StudyFlow{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><a class="skip" href="#main">Skip to content</a><header><div class="shell topbar"><a class="brand" href="/">StudyFlow <span>Student workspace</span></a><nav aria-label="Main navigation"><a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Dashboard</a><a href="/tasks" {% if request.path.startswith('/tasks') %}aria-current="page"{% endif %}>Tasks</a><a href="/courses" {% if request.path.startswith('/courses') %}aria-current="page"{% endif %}>Courses</a></nav></div></header><main id="main" class="shell">{% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer class="shell">A little structure. More room to learn.</footer></body></html>
